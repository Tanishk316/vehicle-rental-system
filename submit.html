<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RentRide | List Your Vehicle</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #121212;
            color: white;
        }

        /* Navbar */

        header {
            background: #1c1c1c;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #0095f6;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
            font-size: 15px;
        }

        nav a:hover {
            color: #0095f6;
        }

        /* Main Section */

        .container {
            max-width: 850px;
            margin: 50px auto;
            padding: 20px;
        }

        .heading {
            text-align: center;
            margin-bottom: 35px;
        }

        .heading h1 {
            font-size: 36px;
            margin-bottom: 12px;
        }

        .heading span {
            color: #0095f6;
        }

        .heading p {
            color: #aaa;
        }

        /* Form */

        .form-box {
            background: #1e1e1e;
            padding: 35px;
            border-radius: 15px;
            border: 1px solid #333;
        }

        .form-row {
            display: flex;
            gap: 20px;
        }

        .input-group {
            flex: 1;
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-size: 14px;
            color: #ddd;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 14px;
            background: #292929;
            border: 1px solid #444;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            outline: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #0095f6;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }


        

        /* Button */

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: #0095f6;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.3s;
        }

        .submit-btn:hover {
            background: #0077cc;
            transform: translateY(-2px);
        }

        /* Footer */

        footer {
            text-align: center;
            padding: 25px;
            background: #1c1c1c;
            color: #aaa;
            margin-top: 50px;
        }

        /* Responsive */

        @media (max-width: 700px) {

            header {
                flex-direction: column;
                gap: 15px;
            }

            nav a {
                margin: 0 8px;
            }

            .form-row {
                flex-direction: column;
                gap: 0;
            }

            .form-box {
                padding: 22px;
            }

            .heading h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <!-- Navbar -->

    <header>

        <div class="logo">🚗 RentRide</div>

        <nav>
            <a href="vehicles.html">Home</a>
            <a href="index.html">Login</a>
        </nav>

    </header>

    <!-- Main Content -->

    <main class="container">

        <div class="heading">

            <h1>
                List Your <span>Vehicle</span>

            </h1>

        </div>

        <div class="form-box">
            <form id="vehicleForm" action="submission.html" method="get">

                <label for="customer">Customer Name</label>
                <input type="text" id="customer" name="customer" required>

                <label for="phone">Contact Number</label>
                <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" required>

                <label for="location">Pickup Location</label>
                <input type="text" id="location" name="location" required>

                <label for="startDate">Available From</label>
                <input type="date" id="startDate" name="startDate" required>

                <label for="endDate">Available Until</label>
                <input type="date" id="endDate" name="endDate" required>

                <button type="submit" class="submit-btn">
                    Submit Vehicle
                </button>

            </form>
        </div>
    </main>

    <!-- Footer -->

    <footer>

        <p>
            © 2026 RentRide Vehicle Rental Platform.
            All Rights Reserved.
        </p>

    </footer>

    
</body>
</html>
